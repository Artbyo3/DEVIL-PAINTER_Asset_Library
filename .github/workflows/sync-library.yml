name: Sync Library

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode: report (diff only, no changes) or apply (scan + publish + commit)"
        required: true
        default: report
        type: choice
        options:
          - report
          - apply
      pack:
        description: "Pack slug (e.g. cloth-textures-vol1) or 'all'"
        required: true
        default: all
        type: string

permissions: {}

concurrency:
  group: sync-library
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'report'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Validate dispatch inputs
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PACK: ${{ inputs.pack }}
        run: |
          if [ "$INPUT_MODE" != "report" ]; then
            echo "ERROR: Invalid mode for report job."
            exit 1
          fi
          if [ "$INPUT_PACK" != "all" ]; then
            if [[ ! "$INPUT_PACK" =~ ^[a-z0-9]([a-z0-9-]{0,108}[a-z0-9])?$ ]] || [[ "$INPUT_PACK" == *".."* ]] || [[ "$INPUT_PACK" == *"--"* ]]; then
              echo "ERROR: Invalid pack slug format."
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --no-cache-dir pillow

      - name: Diff shelves against public state (report only)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PACK: ${{ inputs.pack }}
        run: python tools/sync_library.py

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      actions: write

    steps:
      - name: Validate dispatch inputs
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PACK: ${{ inputs.pack }}
        run: |
          if [ "$INPUT_MODE" != "apply" ]; then
            echo "ERROR: Invalid mode for apply job."
            exit 1
          fi
          if [ "$INPUT_PACK" != "all" ]; then
            if [[ ! "$INPUT_PACK" =~ ^[a-z0-9]([a-z0-9-]{0,108}[a-z0-9])?$ ]] || [[ "$INPUT_PACK" == *".."* ]] || [[ "$INPUT_PACK" == *"--"* ]]; then
              echo "ERROR: Invalid pack slug format."
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --no-cache-dir pillow

      - name: Restore VirusTotal SHA-256 verdict cache
        uses: actions/cache/restore@v4
        with:
          path: .vt-cache
          key: vt-verdicts-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vt-verdicts-v1-${{ github.ref_name }}-

      - name: Sync shelves to public releases, catalog, thumbs, and board
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_TOKEN }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PACK: ${{ inputs.pack }}
          VT_CACHE_FILE: .vt-cache/verdicts.json
        run: python tools/sync_library.py

      - name: Save VirusTotal SHA-256 verdict cache
        if: always() && hashFiles('.vt-cache/verdicts.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .vt-cache
          key: vt-verdicts-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit and push catalog, thumbs, and board updates
        if: success() && steps.sync.outputs.committed_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PACK: ${{ inputs.pack }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- packs.json thumbs/ board/
          if git diff --cached --quiet; then
            echo "No catalog, thumbnail, or board changes to commit."
            exit 0
          fi
          git commit -m "Sync library from shelf (${INPUT_PACK})"
          git pull --rebase origin main
          git push origin main
