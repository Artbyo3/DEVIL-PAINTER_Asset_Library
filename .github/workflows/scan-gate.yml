name: Release Scan Gate

on:
  workflow_dispatch:
    inputs:
      owner_approved:
        description: "Confirm the owner has reviewed the draft release and approved running the scan gate"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Draft release tag to scan (defaults to newest draft release if omitted)"
        required: false
        type: string
      simulate:
        description: "Simulate VirusTotal verdicts from .github/vt-sim-fixtures.json (no API key required)"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-scan-gate
  cancel-in-progress: false

jobs:
  scan-gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pages: write

    steps:
      - name: Require owner approval
        env:
          INPUT_OWNER_APPROVED: ${{ inputs.owner_approved }}
        run: |
          if [ "$INPUT_OWNER_APPROVED" != "true" ]; then
            echo "ERROR: Release Scan Gate refused to run: this gate requires the owner's approval (owner_approved must be true). No assets were scanned and no release was published."
            {
              echo "## Release Scan Gate Refused"
              echo ""
              echo "**Error:** This gate requires the owner's approval (\`owner_approved\` must be \`true\`). No assets were scanned and no release was published."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Validate release_tag format
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          for tag in "$INPUT_RELEASE_TAG" "$EVENT_RELEASE_TAG"; do
            if [ -n "$tag" ]; then
              if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || [[ "$tag" == *".."* ]] || [[ "$tag" == .* ]] || [[ "$tag" == -* ]]; then
                echo "ERROR: Invalid release_tag format."
                exit 1
              fi
            fi
          done

      - name: Check VirusTotal API key secret
        if: inputs.simulate != true
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_TOKEN }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "ERROR: VIRUS_TOTAL_TOKEN secret is not set. Add VIRUS_TOTAL_TOKEN in repository Settings -> Secrets and variables -> Actions. Release remains a draft; no changes were made."
            {
              echo "## Release Scan Gate Blocked"
              echo ""
              echo "**Error:** \`VIRUS_TOTAL_TOKEN\` secret is not set. Add it in **Settings -> Secrets and variables -> Actions**. Release remains a draft; no changes were made."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow for thumbnail generation
        run: python -m pip install --no-cache-dir pillow

      - name: Restore VirusTotal SHA-256 verdict cache
        if: inputs.simulate != true
        uses: actions/cache/restore@v4
        with:
          path: .vt-cache
          key: vt-verdicts-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vt-verdicts-v1-${{ github.ref_name }}-

      - name: Run VirusTotal scan gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SIMULATE: ${{ inputs.simulate }}
          VT_CACHE_FILE: .vt-cache/verdicts.json
          VT_FIXTURES_FILE: .github/vt-sim-fixtures.json
        run: python tools/vt_scan_gate.py

      - name: Save VirusTotal SHA-256 verdict cache
        if: always() && inputs.simulate != true && hashFiles('.vt-cache/verdicts.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .vt-cache
          key: vt-verdicts-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit and push catalog update
        if: success() && inputs.simulate != true && steps.gate.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.gate.outputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || [[ "$RELEASE_TAG" == *".."* ]]; then
            echo "ERROR: Invalid release_tag format."
            exit 1
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packs.json thumbs/
          if git diff --cached --quiet; then
            echo "No catalog or thumbnail changes to commit."
            exit 0
          fi
          git commit -m "Add ${RELEASE_TAG} to catalog after VirusTotal scan"
          git pull --rebase origin main
          git push origin main
          gh api -X POST "repos/${GH_REPO}/pages/builds" >/dev/null 2>&1 || true
